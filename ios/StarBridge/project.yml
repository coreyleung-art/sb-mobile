name: StarBridge
options:
  bundleIdPrefix: com.starbridge
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  StarBridge:
    type: application
    platform: iOS
    sources:
      - path: StarBridgeApp
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starbridge.mobile
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StarBridgeApp/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XS7SMKFS42
        MARKETING_VERSION: "0.9.11"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1"
  StarBridgeMac:
    type: application
    platform: macOS
    sources:
      - path: StarBridgeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starbridge.desktop
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StarBridgeApp/Info-Mac.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XS7SMKFS42
        MARKETING_VERSION: "0.9.13"
        CURRENT_PROJECT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
